{{- if .Values.statusPageSync.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agropredict-ai-status-page-sync
  labels:
    app: agropredict-ai-status-page-sync
spec:
  schedule: {{ .Values.statusPageSync.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.statusPageSync.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.statusPageSync.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: agropredict-ai-status-page-sync
        spec:
          restartPolicy: Never
          serviceAccountName: agropredict-ai-backend
          containers:
            - name: sync
              image: "{{ .Values.statusPageSync.image.repository }}:{{ .Values.statusPageSync.image.tag }}"
              imagePullPolicy: {{ .Values.statusPageSync.image.pullPolicy }}
              env:
                - name: BACKEND_STATUS_URL
                  value: {{ .Values.statusPageSync.backendUrl | quote }}
                - name: STATUSPAGE_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.statusPageSync.secretName }}
                      key: {{ .Values.statusPageSync.endpointSecretKey }}
              command:
                - /bin/sh
                - -ec
                - |
                  payload="$(curl -fsS "${BACKEND_STATUS_URL}")"
                  curl -fsS \
                    -X POST \
                    -H "Content-Type: application/json" \
                    --data "${payload}" \
                    "${STATUSPAGE_ENDPOINT}"
{{- end }}
