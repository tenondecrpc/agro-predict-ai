apiVersion: batch/v1
kind: Job
metadata:
  name: agropredict-ai-sandbox
  labels:
    app: agropredict-ai-sandbox
    component: sandbox
spec:
  template:
    metadata:
      labels:
        app: agropredict-ai-sandbox
        component: sandbox
    spec:
      runtimeClassName: gvisor
      serviceAccountName: agropredict-ai-sandbox
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: sandbox
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "backend.worker"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
