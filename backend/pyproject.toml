[project]
name = "backend"
version = "0.1.0"
description = "Backend runtime backbone for AgroPredict AI."
readme = "README.md"
authors = [
    { name = "Cristian Paniagua", email = "tenondecrpc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "arq>=0.26,<0.27",
    "asyncpg>=0.31.0",
    "fastapi>=0.119,<1",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3,<4",
    "pydantic>=2.12,<3",
    "redis[hiredis]>=5,<6",
    "cryptography>=46.0.6,<47",
    "starlette>=0.49.1,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "oracledb>=2.5,<3",
    "httpx>=0.28,<1",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "pydantic-settings>=2.0,<3",
]

[project.scripts]
backend = "backend.app:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.119,<1",
    "pytest>=9,<10",
    "ruff>=0.11,<1",
    "hypothesis>=6.100,<7",
    "schemathesis>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "chaos: Chaos scenario tests",
    "chaos_scenario: Specific chaos scenario marker",
    "fuzz: Fuzz testing markers",
    "prompt_regression: Prompt regression tests",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
